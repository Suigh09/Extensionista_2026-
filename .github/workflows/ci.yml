name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    env: {DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-000001, DATABASE_ENGINE: sqlite}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install --requirement requirements-dev.txt
      - run: ruff check backend
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest --cov --cov-report=term-missing
      - run: pip-audit --requirement requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
