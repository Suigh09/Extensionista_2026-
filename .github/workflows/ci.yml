on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check da documentação
        run: |
          test -f documentos/README.md
          test -f LICENSE
          echo "Estrutura básica do repositório OK."

