services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 3s, retries: 10}
    networks: [internal]
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    env_file: .env
    volumes: [protected_media:/app/backend/protected-media]
    depends_on: {db: {condition: service_healthy}}
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"], interval: 10s, timeout: 5s, retries: 5}
    networks: [internal]
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    depends_on: {backend: {condition: service_healthy}}
    ports: ["127.0.0.1:8080:8080"]
    networks: [internal]
networks: {internal: {driver: bridge}}
volumes: {postgres_data: {}, protected_media: {}}
